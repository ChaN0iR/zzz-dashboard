name: battery
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: battery
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch battery
        env:
          HOYO_LTUID_V2: ${{ secrets.HOYO_LTUID_V2 }}
          HOYO_LTOKEN_V2: ${{ secrets.HOYO_LTOKEN_V2 }}
          ZZZ_UID: ${{ secrets.ZZZ_UID }}
        run: node scripts/sync-battery.js
      - name: Fetch game record
        continue-on-error: true
        env:
          HOYO_LTUID_V2: ${{ secrets.HOYO_LTUID_V2 }}
          HOYO_LTOKEN_V2: ${{ secrets.HOYO_LTOKEN_V2 }}
          ZZZ_UID: ${{ secrets.ZZZ_UID }}
        run: node scripts/sync-data.js
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain battery.json data.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add battery.json data.json
            git commit -m "sync: battery and game record [skip ci]"
            git pull --rebase -q
            git push
          else
            echo "No change"
          fi
